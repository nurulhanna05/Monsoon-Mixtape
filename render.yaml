# Render blueprint: on render.com choose New → Blueprint and pick this repo.
# Free plan; it sleeps after ~15 minutes without visitors and takes about a
# minute to wake. Every push to main redeploys it.
services:
  - type: web
    name: monsoon-mixtape
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /share-url
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
