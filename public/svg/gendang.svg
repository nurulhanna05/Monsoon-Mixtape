<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 90" role="img" aria-label="Gendang: barrel drum with laced heads at both ends">
  <g class="drum">
    <!-- Barrel body -->
    <path d="M22 18 Q70 4 118 18 L118 72 Q70 86 22 72 Z" fill="#8b4f2a" stroke="#5a3a1a" stroke-width="2"/>
    <!-- Rattan lacing -->
    <g stroke="#e3c27a" stroke-width="2" fill="none">
      <path d="M26 20 L46 70 L66 16 L86 72 L106 18"/>
      <path d="M26 70 L46 18"/>
      <path d="M86 16 L114 70"/>
    </g>
    <!-- Drum heads -->
    <ellipse class="skin" cx="22" cy="45" rx="10" ry="28" fill="#efdcb5" stroke="#5a3a1a" stroke-width="2"/>
    <ellipse class="skin" cx="118" cy="45" rx="8" ry="27" fill="#efdcb5" stroke="#5a3a1a" stroke-width="2"/>
  </g>
</svg>
