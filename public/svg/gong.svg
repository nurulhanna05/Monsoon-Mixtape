<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" role="img" aria-label="Gong: large bronze gong hanging in a wooden frame">
  <!-- Frame -->
  <g fill="#8b4f2a" stroke="#5a3a1a" stroke-width="1.5">
    <rect x="8" y="10" width="104" height="9" rx="3"/>
    <rect x="12" y="16" width="8" height="108" rx="2"/>
    <rect x="100" y="16" width="8" height="108" rx="2"/>
  </g>
  <line x1="60" y1="19" x2="60" y2="32" stroke="#3a2a1a" stroke-width="2"/>
  <!-- Ripples (shown when the gong is struck) -->
  <g fill="none" stroke="#c9a227" stroke-width="2">
    <circle class="ripple" cx="60" cy="74" r="40" opacity="0"/>
    <circle class="ripple" cx="60" cy="74" r="40" opacity="0"/>
  </g>
  <!-- The gong -->
  <g class="disc">
    <circle cx="60" cy="74" r="40" fill="#c9a227" stroke="#8a6d12" stroke-width="2"/>
    <circle cx="60" cy="74" r="30" fill="none" stroke="#b08a1c" stroke-width="2"/>
    <circle cx="60" cy="74" r="11" fill="#e0bb3a" stroke="#8a6d12" stroke-width="2"/>
  </g>
</svg>
