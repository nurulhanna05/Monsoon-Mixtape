<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Kompang: round frame drum">
  <g class="drum">
    <!-- Wooden frame -->
    <circle cx="50" cy="50" r="42" fill="#8b4f2a" stroke="#5a3a1a" stroke-width="2"/>
    <!-- Goatskin head -->
    <circle class="skin" cx="50" cy="50" r="35" fill="#efdcb5"/>
    <circle cx="50" cy="50" r="35" fill="none" stroke="#d9c08f" stroke-width="2"/>
    <!-- Tacks around the rim -->
    <g fill="#c9a227">
      <circle cx="50" cy="11" r="2"/><circle cx="89" cy="50" r="2"/><circle cx="50" cy="89" r="2"/><circle cx="11" cy="50" r="2"/>
      <circle cx="78" cy="22" r="2"/><circle cx="78" cy="78" r="2"/><circle cx="22" cy="78" r="2"/><circle cx="22" cy="22" r="2"/>
    </g>
  </g>
</svg>
