<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" role="img" aria-label="Sape: long boat-shaped lute from Sarawak with painted motifs">
  <!-- Long body with a curled head on the right -->
  <path d="M14 58 Q20 38 60 40 L150 44 Q172 44 182 34 Q190 28 186 40 Q180 56 150 58 L60 64 Q20 70 14 58 Z" fill="#f2e6cf" stroke="#6b3d1f" stroke-width="2"/>
  <!-- Orang Ulu-style painted motif -->
  <g fill="none" stroke="#a4452c" stroke-width="2" stroke-linecap="round">
    <path d="M30 54 q8 -10 16 0 q8 10 16 0"/>
    <path d="M70 52 q6 -8 12 0 q6 8 12 0"/>
    <circle cx="42" cy="54" r="3"/>
  </g>
  <!-- Frets -->
  <g stroke="#6b3d1f" stroke-width="2">
    <line x1="110" y1="45" x2="110" y2="58"/><line x1="122" y1="45" x2="122" y2="58"/>
    <line x1="134" y1="45" x2="134" y2="58"/><line x1="146" y1="45" x2="146" y2="58"/>
  </g>
  <!-- Strings -->
  <g class="strings" stroke="#3a2a1a" stroke-width="1.2">
    <line class="string" x1="40" y1="49" x2="176" y2="40"/>
    <line class="string" x1="40" y1="53" x2="176" y2="44"/>
    <line class="string" x1="40" y1="57" x2="176" y2="48"/>
  </g>
  <!-- Tuning pegs -->
  <g fill="#6b3d1f"><circle cx="172" cy="36" r="3"/><circle cx="178" cy="50" r="3"/></g>
</svg>
