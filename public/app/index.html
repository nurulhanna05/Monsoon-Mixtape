<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Built into public/app/, so "../" is the classic site's public folder. -->
  <base href="/app/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hear 20 years of NASA climate data for any place in Malaysia, played on Malaysian instruments.">
  <meta name="theme-color" content="#0B3D91">
  <title>Monsoon Mixtape</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    /* Shown until Flutter has drawn its first frame. */
    body { margin: 0; background: #F3F5FA; font-family: system-ui, sans-serif; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #0B3D91; }
    #loading span { display: block; width: 48px; height: 48px; border: 5px solid #E3E9F5; border-top-color: #E4002B;
      border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 12px; }
    @media (prefers-color-scheme: dark) {
      body { background: #070E22; }
      #loading { color: #9DBBFF; }
      #loading span { border-color: #1C2B55; border-top-color: #FF7A66; }
    }
    /* The band (band.js) standing on the rhythm stage, above the note lanes. */
    .band-stage {
      display: flex; justify-content: center; align-items: flex-end; gap: 2px;
      height: 100%; box-sizing: border-box; padding: 6px 6px 0; pointer-events: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      background: linear-gradient(to bottom, transparent 55%, rgba(157, 187, 255, 0.12));
      font-family: Poppins, system-ui, sans-serif;
    }
    .band-stage .player {
      flex: 1 1 0; max-width: 110px; margin: 0; text-align: center;
      opacity: 0.55; transition: opacity 0.3s, filter 0.3s;
    }
    .band-stage .player.active { opacity: 1; }
    .band-stage .player.muted { opacity: 0.2; filter: grayscale(1); }
    .band-stage .player[hidden] { display: none; }
    .band-stage .player svg { display: block; width: 100%; height: auto; max-height: 92px; overflow: visible; }
    .band-stage .player figcaption { color: #fff; font-size: 10px; font-weight: 600; line-height: 1.6; }
    .band-stage .player figcaption small { display: none; }
    .band-stage .player .haze { opacity: 0; transition: opacity 0.4s; }
    .band-stage .player-seruling.hazy svg { filter: grayscale(0.9); }
    .band-stage .player-seruling.hazy .haze { opacity: 0.55; }
    .band-stage.no-motion .player, .band-stage.no-motion .haze { transition: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #loading span { display: block; animation: none; } }
  </style>
</head>
<body>
  <div id="loading" aria-live="polite"><div><span></span>Loading Monsoon Mixtape…</div></div>

  <!-- The shared sound engine (same as the classic page). Flutter starts
       only once the bridge exists, since the app talks to it straight away. -->
  <script src="../vendor/tone.js"></script>
  <script type="module">
    import "./audio_bridge.js";
    window.addEventListener("flutter-first-frame", () => document.getElementById("loading").remove());
    const flutter = document.createElement("script");
    flutter.src = "flutter_bootstrap.js";
    document.body.append(flutter);
  </script>
</body>
</html>
