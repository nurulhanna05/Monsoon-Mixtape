name: monsoon_mixtape
description: "Monsoon Mixtape, casual Flutter version: 20 years of NASA climate data as a song."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  http: ^1.6.0
  latlong2: ^0.10.1
  material_ui: ^1.11.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: any

flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
        - asset: fonts/Poppins-ExtraBold.ttf
          weight: 800
