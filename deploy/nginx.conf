# nginx in front of the app; setup.sh fills in __DOMAIN__ (or _ for any).
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Photos, samples and the Flutter build are big; let browsers compress.
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # First visit to a new place asks NASA POWER, which can be slow.
        proxy_read_timeout 120s;
    }
}
